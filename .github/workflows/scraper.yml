name: Daily Compuzone Scraper

on:
  schedule:
    # 매일 한국시간 자정 (UTC 15:00) - 전체 브랜드 자동 실행
    - cron: '0 15 * * *'
    # 재시도: GitHub Actions IP에서 컴퓨존 접속이 막히는 날이 잦아(약 절반) 같은 날 다시 실행.
    # 오늘 이미 저장된 브랜드는 건너뛰고 빠진 브랜드만 수집한다 (RESUME_TODAY).
    # 모두 KST 같은 날짜 안(UTC 15:00 이전)에 들어가도록 설정.
    - cron: '0 21 * * *'   # KST 06:00
    - cron: '0 1 * * *'    # KST 10:00
    - cron: '0 5 * * *'    # KST 14:00
    - cron: '0 9 * * *'    # KST 18:00
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      brand:
        description: '특정 브랜드만 크롤링 (비우면 전체)'
        required: false
        default: ''
        type: string

# 지연된 실행끼리 겹쳐 같은 브랜드를 동시에 수집하지 않도록 순차 실행
concurrency:
  group: compuzone-scraper
  cancel-in-progress: false

jobs:
  scrape-and-save:
    # 컴퓨존이 GitHub(미국) 서버 접속을 자주 차단해서 사무실 PC(한국, Windows)의
    # 셀프호스트 러너에서 실행한다. PC가 꺼져 있으면 작업은 PC가 켜질 때까지 대기한다.
    # ⚠ 공개 저장소라 pull_request 트리거를 절대 추가하지 말 것 (외부인이 PC에서 코드 실행 가능)
    runs-on: [self-hosted, windows, compuzone]
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        shell: cmd
        run: |
          call npm install playwright firebase-admin || exit /b 1
          call npx playwright install chromium || exit /b 1

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMPUZONE_ID: ${{ secrets.COMPUZONE_ID }}
          COMPUZONE_PW: ${{ secrets.COMPUZONE_PW }}
          CRAWL_BRAND: ${{ github.event.inputs.brand }}
          RESUME_TODAY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        shell: cmd
        run: node crawler.js
